  // Median-cut quantization: reduce an arbitrary image to a palette of at most
  // 64 representative colours, then encode per-row RLE exactly like the
  // reference Palette64 wallpaper generator.
  function medianCutPixels(pixels, width, height, maxColors) {
    const count = width * height;
    // Collect unique colours (24-bit keys) with their frequency.
    const histogram = new Map();
    for (let i = 0; i < count; i++) {
      const offset = i * 4;
      const key = ((pixels.data[offset] & 0xff) << 16) |
        ((pixels.data[offset + 1] & 0xff) << 8) |
        (pixels.data[offset + 2] & 0xff);
      histogram.set(key, (histogram.get(key) || 0) + 1);
    }

    const boxes = [{
      entries: [...histogram.entries()],
      min: [255, 255, 255], max: [0, 0, 0]
    }];
    for (const [key] of boxes[0].entries) {
      for (let c = 0; c < 3; c++) {
        const v = key >> (16 - c * 8) & 0xff;
        if (v < boxes[0].min[c]) boxes[0].min[c] = v;
        if (v > boxes[0].max[c]) boxes[0].max[c] = v;
      }
    }

    while (boxes.length < maxColors) {
      let selected = -1;
      let selectedRange = -1;
      for (let b = 0; b < boxes.length; b++) {
        const box = boxes[b];
        if (box.entries.length < 2) continue;
        const range = Math.max(
          box.max[0] - box.min[0], box.max[1] - box.min[1], box.max[2] - box.min[2]);
        if (range > selectedRange) {
          selected = b;
          selectedRange = range;
        }
      }
      if (selected < 0 || selectedRange === 0) break;
      const box = boxes[selected];
      const channel = box.max[0] - box.min[0] >= box.max[1] - box.min[1] &&
        box.max[0] - box.min[0] >= box.max[2] - box.min[2] ? 0 :
        (box.max[1] - box.min[1] >= box.max[2] - box.min[2] ? 1 : 2);
      box.entries.sort((a, key) =>
        ((a[0] >> (16 - channel * 8)) & 0xff) - ((key[0] >> (16 - channel * 8)) & 0xff));
      const splitAt = box.entries.length >> 1;
      const leftEntries = box.entries.slice(0, splitAt);
      const rightEntries = box.entries.slice(splitAt);
      const left = { entries: leftEntries, min: [255, 255, 255], max: [0, 0, 0] };
      const right = { entries: rightEntries, min: [255, 255, 255], max: [0, 0, 0] };
      for (const side of [left, right]) {
        for (const [key] of side.entries) {
          for (let c = 0; c < 3; c++) {
            const v = key >> (16 - c * 8) & 0xff;
            if (v < side.min[c]) side.min[c] = v;
            if (v > side.max[c]) side.max[c] = v;
          }
        }
      }
      boxes.splice(selected, 1, left, right);
    }

    const palette = boxes.map(box => {
      let r = 0; let g = 0; let b = 0; let total = 0;
      for (const [key, weight] of box.entries) {
        r += (key >> 16 & 0xff) * weight;
        g += (key >> 8 & 0xff) * weight;
        b += (key & 0xff) * weight;
        total += weight;
      }
      return [Math.round(r / total), Math.round(g / total), Math.round(b / total)];
    });

    const indexMap = new Uint8Array(count);
    const representative = boxes.map(box => box.entries[0][0]);
    for (let i = 0; i < count; i++) {
      const offset = i * 4;
      let best = 0;
      let bestDistance = Infinity;
      for (let p = 0; p < palette.length; p++) {
        const dr = pixels.data[offset] - palette[p][0];
        const dg = pixels.data[offset + 1] - palette[p][1];
        const db = pixels.data[offset + 2] - palette[p][2];
        const distance = dr * dr + dg * dg + db * db;
        if (distance < bestDistance) {
          best = p;
          bestDistance = distance;
        }
      }
      indexMap[i] = best;
      const color = palette[best];
      pixels.data[offset] = color[0];
      pixels.data[offset + 1] = color[1];
      pixels.data[offset + 2] = color[2];
      pixels.data[offset + 3] = 255;
    }
    return { palette, indexMap };
  }

  function picoNearest(rgb) {
    const pico = PixelToyMidiCart.PALETTE;
    let best = 0;
    let bestDistance = Infinity;
    for (let i = 0; i < pico.length; i++) {
      const dr = rgb[0] - pico[i][0];
      const dg = rgb[1] - pico[i][1];
      const db = rgb[2] - pico[i][2];
      const distance = dr * dr + dg * dg + db * db;
      if (distance < bestDistance) {
        best = i;
        bestDistance = distance;
      }
    }
    return best;
  }

  function imageCartToP8(palette, indexMap, name) {
    const colorHex = index => index.toString(16).padStart(2, '0');
    let data = '';
    for (let y = 0; y < 128; y++) {
      let x = 0;
      while (x < 128) {
        const color = indexMap[y * 128 + x];
        let length = 1;
        while (x + length < 128 && indexMap[y * 128 + x + length] === color && length < 255) {
          length++;
        }
        data += colorHex(color) + colorHex(length);
        x += length;
      }
    }
    const dataLines = [];
    for (let offset = 0; offset < data.length; offset += 128) {
      dataLines.push(data.slice(offset, offset + 128));
    }
    const fallback = palette.map(picoNearest);
    const title = `image ${name || 'untitled'}`.slice(0, 40).replace(/["\n\r]/g, ' ');
    const paletteLines = palette.map(color =>
      ` {${color[0]},${color[1]},${color[2]}},`).join('\n');
    const dataString = dataLines.map(line => ` "${line}",`).join('\n');
    const luaPreviewLength =
      dataString.length + palette.length * 16 + fallback.length * 3 + 4000;
    if (luaPreviewLength > 60000) {
      throw new Error('Image is too detailed for a 64-colour Cart; try a simpler image');
    }
    const lua = [
      'pico-8 cartridge // http://www.pico-8.com',
      'version 42',
      '__lua__',
      `-- generated image cart: ${title}`,
      '-- picopico: 64-colour overlay  official pico-8: 16-colour fallback',
      '',
      'has_p64=type(p64clear)=="function" and type(p64pal)=="function"',
      `fallback={${fallback.join(',')}}`,
      'palette={',
      paletteLines,
      '}',
      '',
      'if not has_p64 then',
      ' function p64clear() cls(0) end',
      ' function p64pal() end',
      ' function p64line(x0,y0,x1,y1,c)',
      '  line(x0,y0,x1,y1,fallback[c+1])',
      ' end',
      'end',
      '',
      'data={',
      dataString,
      '}',
      '',
      'function _init()',
      ' p64clear()',
      ' if has_p64 then',
      '  for i=1,#palette do',
      '   local c=palette[i]',
      '   p64pal(i-1,c[1],c[2],c[3])',
      '  end',
      ' end',
      ' local x=0 local y=0',
      ' for s in all(data) do',
      '  for i=1,#s,4 do',
      '   local c=tonum("0x"..sub(s,i,i+1))',
      '   local n=tonum("0x"..sub(s,i+2,i+3))',
      '   p64line(x,y,x+n-1,y,c)',
      '   x+=n',
      '   if x>=128 then x=0 y+=1 end',
      '  end',
      ' end',
      'end',
      '',
      'function _draw() end',
      '',
      '__gfx__',
      ...Array.from({ length: 128 }, () => '0'.repeat(128))
    ].join('\n');
    const bytes = new TextEncoder().encode(lua);
    return bytes;
  }

  // --- GIF dynamic wallpaper ----------------------------------------------
  const gifWallpaper = {
    bytes: null, fileName: '', frames: [], frameIndex: 0, timer: 0
  };

  function stopGifWallpaperPreview() {
    if (gifWallpaper.timer) {
      clearInterval(gifWallpaper.timer);
      gifWallpaper.timer = 0;
    }
  }

  function drawGifWallpaperFrame() {
    if (!gifWallpaper.frames.length) return;
    const preview = document.getElementById('gif-wallpaper-preview');
    const context = preview.getContext('2d');
    const image = context.createImageData(128, 128);
    image.data.set(gifWallpaper.frames[gifWallpaper.frameIndex]);
    context.putImageData(image, 0, 0);
    gifWallpaper.frameIndex = (gifWallpaper.frameIndex + 1) % gifWallpaper.frames.length;
  }

  function startGifWallpaperPreview(frames, fps) {
    stopGifWallpaperPreview();
    gifWallpaper.frames = frames.map(frame => new Uint8ClampedArray(frame));
    gifWallpaper.frameIndex = 0;
    gifWallpaper.fps = fps;
    const preview = document.getElementById('gif-wallpaper-preview');
    preview.hidden = false;
    drawGifWallpaperFrame();
    gifWallpaper.timer = setInterval(
      drawGifWallpaperFrame, Math.max(40, Math.round(1000 / fps)));
  }

  function scaleGifFrameTo128(rgba, sourceWidth, sourceHeight) {
    const source = document.createElement('canvas');
    source.width = sourceWidth;
    source.height = sourceHeight;
    const sourceContext = source.getContext('2d');
    const sourceImage = sourceContext.createImageData(sourceWidth, sourceHeight);
    sourceImage.data.set(rgba);
    sourceContext.putImageData(sourceImage, 0, 0);
    const target = document.createElement('canvas');
    target.width = target.height = 128;
    const context = target.getContext('2d');
    context.imageSmoothingEnabled = true;
    context.imageSmoothingQuality = 'high';
    const side = Math.min(sourceWidth, sourceHeight);
    context.drawImage(source,
      (sourceWidth - side) / 2, (sourceHeight - side) / 2, side, side,
      0, 0, 128, 128);
    return context.getImageData(0, 0, 128, 128).data;
  }

  function gifWallpaperSettings() {
    return {
      colors: Math.min(64, Math.max(16, Number(
        document.getElementById('gif-wallpaper-colors').value) || 64)),
      fps: Number(document.getElementById('gif-wallpaper-fps').value) || 10,
      maxFrames: Math.min(64, Math.max(8, Number(
        document.getElementById('gif-wallpaper-frames').value) || 16)),
      backgroundMidiVolume: Math.min(200, Math.max(0, Number(
        document.getElementById('gif-wallpaper-midi-volume').value) || 0))
    };
  }

  async function gifWallpaperMidiHeader() {
    const input = document.getElementById('gif-wallpaper-midi');
    const file = input.files[0];
    if (!file) return '';
    const midi = new Uint8Array(await file.arrayBuffer());
    const cart = await PixelToyMidiCart.buildMidiCart({
      tracks: [{ midi, title: 'bgm' }]
    });
    const start = cart.text.indexOf('--[[picopico-midi-v2');
    const end = start >= 0 ? cart.text.indexOf(']]', start) : -1;
    return start >= 0 && end > start ? cart.text.slice(start, end + 2) : '';
  }

  async function convertGifWallpaperFile(file) {
    stopGifWallpaperPreview();
    gifWallpaper.bytes = null;
    gifWallpaper.frames = [];
    document.getElementById('download-gif-wallpaper').disabled = true;
    document.getElementById('push-gif-wallpaper').disabled = true;
    document.getElementById('gif-wallpaper-preview').hidden = true;
    document.getElementById('gif-wallpaper-meta').textContent = '';
    currentStatus = null;
    status.textContent = '';
    const settings = gifWallpaperSettings();
    try {
      const midiHeader = await gifWallpaperMidiHeader();
      const decoded = PixelToyGifWallpaper.decodeGif(
        await file.arrayBuffer(), settings.maxFrames);
      if (decoded.frames.length < 2) {
        setStatus('gifWallpaperStatic');
        return;
      }
      const scaledFrames = decoded.frames.map(frame =>
        scaleGifFrameTo128(frame.rgba, decoded.width, decoded.height));
      const previews = scaledFrames;
      PixelToyGifWallpaper.quantizePreview(previews, 128, 128, settings.colors);
      const result = PixelToyGifWallpaper.buildWallpaperAdaptive(
        previews, 128, 128, {
          name: file.name, fps: settings.fps,
          colors: settings.colors, maxFrames: settings.maxFrames,
          backgroundMidiHeader: midiHeader,
          backgroundMidiVolume: settings.backgroundMidiVolume
        });
      const baseName = (file.name.replace(/\.gif$/i, '') || 'gif_wallpaper')
        .replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^_+|_+$/g, '');
      gifWallpaper.bytes = new TextEncoder().encode(result.text);
      gifWallpaper.fileName = `${(baseName || 'gif_wallpaper').slice(0, 48)}_wallpaper.p8`;
      startGifWallpaperPreview(result.frames, result.fps || settings.fps);
      const values = {
        frames: String(result.frameCount),
        colors: String(result.colors),
        fps: String(result.fps),
        seconds: (result.frameCount / result.fps).toFixed(1),
        lua: (result.luaBytes / 1024).toFixed(1),
        size: (result.size / 1024).toFixed(1)
      };
      document.getElementById('gif-wallpaper-meta').textContent =
        text('gifWallpaperConverted', values);
      document.getElementById('download-gif-wallpaper').disabled = false;
      document.getElementById('push-gif-wallpaper').disabled = false;
    } catch (error) {
      if (error && typeof error.luaBytes === 'number') {
        const frames = Number(error.frameCount) || settings.maxFrames;
        const colors = Number(error.colors) || settings.colors;
        const fps = Number(error.fps) || settings.fps;
        const limitBytes = PixelToyGifWallpaper.MAX_LUA_BYTES;
        const overKiB = Math.max(0, (error.luaBytes - limitBytes) / 1024);
        const attempts = (error.attempts || []).map(attempt =>
          `${attempt.colors}x${attempt.frameCount}: ${(attempt.luaBytes / 1024).toFixed(1)} KiB`)
          .join(' → ');
        const values = {
          frames: String(frames),
          colors: String(colors),
          fps: String(fps),
          seconds: (frames / fps).toFixed(1),
          lua: (error.luaBytes / 1024).toFixed(1),
          limit: (limitBytes / 1024).toFixed(1),
          over: overKiB.toFixed(1),
          attempts: attempts || `${colors}色×${frames}帧`
        };
        document.getElementById('gif-wallpaper-meta').textContent =
          text('gifWallpaperTooLarge', values);
      } else {
        document.getElementById('gif-wallpaper-meta').textContent = error.message;
      }
    }
  }

  document.getElementById('gif-wallpaper-file').onchange = event => {
    const file = event.target.files[0];
    if (!file) return;
    convertGifWallpaperFile(file);
  };
  document.getElementById('gif-wallpaper-midi').onchange = () => {
    const file = document.getElementById('gif-wallpaper-file').files[0];
    if (file) convertGifWallpaperFile(file);
  };
  document.getElementById('gif-wallpaper-midi-volume').oninput = event => {
    document.getElementById('gif-wallpaper-midi-volume-value').textContent =
      `${event.target.value}%`;
  };
  for (const id of ['gif-wallpaper-colors', 'gif-wallpaper-fps',
                    'gif-wallpaper-frames', 'gif-wallpaper-midi-volume']) {
    document.getElementById(id).addEventListener('change', () => {
      const file = document.getElementById('gif-wallpaper-file').files[0];
      if (file) convertGifWallpaperFile(file);
    });
  }

  document.getElementById('download-gif-wallpaper').onclick = () => {
    if (!gifWallpaper.bytes) {
      setStatus('gifWallpaperNoFile');
      return;
    }
    const link = document.createElement('a');
    const url = URL.createObjectURL(
      new Blob([gifWallpaper.bytes], { type: 'text/plain;charset=utf-8' }));
    link.href = url;
    link.download = gifWallpaper.fileName || 'gif_wallpaper.p8';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  document.getElementById('push-gif-wallpaper').onclick = async () => {
    if (!gifWallpaper.bytes) {
      setStatus('gifWallpaperNoFile');
      return;
    }
    const button = document.getElementById('push-gif-wallpaper');
    button.disabled = true;
    try {
      const file = new File(
        [gifWallpaper.bytes], gifWallpaper.fileName || 'gif_wallpaper.p8',
        { type: 'text/plain;charset=utf-8' });
      await uploadFile(file, '/api/push');
      setStatus('gifWallpaperPushed');
    } catch (error) {
      setStatus('uploadFailed', { error: error.message });
    } finally {
      button.disabled = false;
    }
  };

</script>
</body>
</html>
